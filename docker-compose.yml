services:
    db:
        image: postgres:16
        container_name: vakilsuite_db
        environment:
            POSTGRES_USER: vakilsuite
            POSTGRES_PASSWORD: vakilsuite
            POSTGRES_DB: vakilsuite
            POSTGRES_HOST_AUTH_METHOD: trust
        ports:
            - "5432:5432"
        volumes:
            - vakilsuite_db_data:/var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        container_name: vakilsuite_redis
        ports:
            - "6379:6379"
        restart: unless-stopped

volumes:
    vakilsuite_db_data:
